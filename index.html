<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Pro | Secure Field Tracking</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --success: #16a34a; 
            --danger: #dc2626; 
            --dark: #1e293b; 
            --gray: #64748b;
            --bg: #f8fafc;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            color: var(--dark); 
        }

        .container { 
            background: white; 
            width: 100%; 
            max-width: 600px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            padding: 30px; 
            position: relative;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #e2e8f0; 
            padding-bottom: 20px; 
        }
        
        .clock { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--primary); 
            margin: 5px 0; 
        }

        /* Navigation / Mode Switcher */
        .nav-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Forms and Inputs */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 1rem; 
            transition: 0.2s; 
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
        }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn { 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            color: white; 
            font-size: 1rem; 
            transition: opacity 0.2s;
        }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        .btn-primary { background: var(--primary); width: 100%; }
        .btn-dark { background: var(--dark); width: 100%; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Admin Controls */
        .filter-card { 
            background: #f1f5f9; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
        }
        .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }

        /* Logs Table */
        .table-wrapper {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            position: sticky;
            top: 0;
            font-weight: 600;
            color: var(--gray);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .badge-in { background: #dcfce7; color: #15803d; }
        .badge-out { background: #fee2e2; color: #b91c1c; }

        .map-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .map-link:hover { text-decoration: underline; }

        .employee-status {
            margin-top: 15px;
            padding: 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Attendance Pro</h2>
        <div class="clock" id="live-clock">00:00:00</div>
        <div id="live-date" style="color: var(--gray); font-weight: 500;"></div>
    </div>

    <!-- Interface Switcher Tabs -->
    <div class="nav-tabs">
        <button id="tabEmp" class="tab-btn active" onclick="switchTab('employee')">Employee Clock-In</button>
        <button id="tabAdmin" class="tab-btn" onclick="switchTab('admin')">Admin Portal</button>
    </div>

    <!-- EMPLOYEE VIEW -->
    <div id="employeeView" class="view-section active">
        <div class="input-group">
            <label for="empName">Employee Name</label>
            <input type="text" id="empName" placeholder="Enter Full Name" oninput="toggleButtons()">
        </div>

        <div class="btn-grid">
            <button id="inBtn" class="btn btn-in" onclick="markAttendance('IN')" disabled>Clock In</button>
            <button id="outBtn" class="btn btn-out" onclick="markAttendance('OUT')" disabled>Clock Out</button>
        </div>

        <div id="lastActionNotice" class="employee-status" style="display: none;"></div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminView" class="view-section">
        <!-- Auth Step -->
        <div id="adminAuth" class="input-group">
            <label for="adminPass">Admin Password</label>
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <button class="btn btn-primary" style="margin-top: 10px;" onclick="verifyAdmin()">Login as Admin</button>
        </div>

        <!-- Dashboard Step -->
        <div id="adminDashboard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: 700; color: var(--primary);">Authenticated</span>
                <button onclick="logoutAdmin()" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; font-weight: 600;">Logout</button>
            </div>

            <div class="filter-card">
                <label>Filter & Download Report</label>
                <div class="filter-row">
                    <select id="selMonth" onchange="renderAdminTable()">
                        <option value="1">January</option><option value="2">February</option>
                        <option value="3">March</option><option value="4">April</option>
                        <option value="5">May</option><option value="6">June</option>
                        <option value="7">July</option><option value="8">August</option>
                        <option value="9">September</option><option value="10">October</option>
                        <option value="11">November</option><option value="12">December</option>
                    </select>
                    <input type="number" id="selYear" value="2026" oninput="renderAdminTable()">
                </div>
                <button class="btn btn-dark" onclick="exportData()">Download Excel (CSV) Report</button>
            </div>

            <label>All Employee Records</label>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Date/Time</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // System Database Initialization
    let db = JSON.parse(localStorage.getItem('att_v3')) || [];
    let isAdminAuthenticated = false;
    
    // Set Default Month in Admin Dropdown to Current Month
    document.getElementById('selMonth').value = new Date().getMonth() + 1;

    // Live Clock Logic
    setInterval(() => {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString();
        document.getElementById('live-date').innerText = now.toDateString();
    }, 1000);

    // Tab Navigation
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

        if (tab === 'employee') {
            document.getElementById('tabEmp').classList.add('active');
            document.getElementById('employeeView').classList.add('active');
        } else {
            document.getElementById('tabAdmin').classList.add('active');
            document.getElementById('adminView').classList.add('active');
        }
    }

    // Employee Interface Logic
    function toggleButtons() {
        const name = document.getElementById('empName').value.trim();
        document.getElementById('inBtn').disabled = name === "";
        document.getElementById('outBtn').disabled = name === "";
    }

    // UPDATED: Fixed attendance handler that records data regardless of GPS errors
    function markAttendance(type) {
        const name = document.getElementById('empName').value.trim();
        
        function saveEntry(lat = "N/A", lon = "N/A", mapUrl = "Location Unavailable") {
            const now = new Date();
            const entry = {
                id: Date.now(),
                name: name,
                type: type,
                date: now.toLocaleDateString(),
                month: now.getMonth() + 1,
                year: now.getFullYear(),
                time: now.toLocaleTimeString(),
                lat: lat,
                lon: lon,
                mapUrl: mapUrl
            };

            db.push(entry);
            localStorage.setItem('att_v3', JSON.stringify(db));

            // Feedback display for Employee
            const statusDiv = document.getElementById('lastActionNotice');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `Successfully recorded <b>${type}</b> for <b>${name}</b> at ${entry.time}`;

            alert(`${type} recorded successfully.`);
            
            // Sync with Admin Dashboard
            if (isAdminAuthenticated) renderAdminTable();
        }

        if (!navigator.geolocation) {
            saveEntry();
        } else {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    saveEntry(lat, lon, `https://www.google.com/maps?q=${lat},${lon}`);
                },
                (err) => {
                    // Fallback execution if iframe/browser blocks GPS permissions
                    saveEntry();
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
    }

    // Admin Authentication
    function verifyAdmin() {
        const pass = document.getElementById('adminPass').value;
        // Default admin password
        if (pass === '1510DivinamS') {
            isAdminAuthenticated = true;
            document.getElementById('adminAuth').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            document.getElementById('adminPass').value = '';
            renderAdminTable();
        } else {
            alert("Invalid Password!");
        }
    }

    function logoutAdmin() {
        isAdminAuthenticated = false;
        document.getElementById('adminAuth').style.display = 'block';
        document.getElementById('adminDashboard').style.display = 'none';
    }

    // Render Admin Records Table
    function renderAdminTable() {
        if (!isAdminAuthenticated) return;

        const m = parseInt(document.getElementById('selMonth').value);
        const y = parseInt(document.getElementById('selYear').value);
        const tbody = document.getElementById('adminTableBody');

        const filtered = db.filter(item => item.month === m && item.year === y);

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--gray);">No attendance records found for this period.</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.slice().reverse().map(item => `
            <tr>
                <td><b>${item.name}</b></td>
                <td><span class="badge ${item.type === 'IN' ? 'badge-in' : 'badge-out'}">${item.type}</span></td>
                <td>${item.date}<br><small style="color:var(--gray)">${item.time}</small></td>
                <td>${item.mapUrl.startsWith('http') ? `<a href="${item.mapUrl}" target="_blank" class="map-link">View Map</a>` : '<span style="color:var(--gray)">N/A</span>'}</td>
            </tr>
        `).join('');
    }

    // Export CSV Functionality (Admin Only)
    function exportData() {
        if (!isAdminAuthenticated) return;

        const m = parseInt(document.getElementById('selMonth').value);
        const y = parseInt(document.getElementById('selYear').value);

        const filtered = db.filter(item => item.month === m && item.year === y);

        if (filtered.length === 0) {
            return alert("No data available to export for the selected Month and Year.");
        }

        let csv = "Employee Name,Type,Date,Time,Latitude,Longitude,Google_Maps_URL\n";
        
        filtered.forEach(item => {
            csv += `"${item.name}",${item.type},${item.date},${item.time},${item.lat},${item.lon},"${item.mapUrl}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Attendance_Report_${m}_${y}.csv`;
        link.click();
    }
</script>

</body>
</html>
